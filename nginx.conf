# blocks.zone reverse proxy for Russia: browsers reach this Moscow box,
# it forwards to Vercel (whose IPs are filtered by TSPU in RU).
# The app sees Host: blocks.zone, so OAuth callbacks and redirects are unchanged.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  # Re-resolve Vercel every 5 min instead of pinning the IP from startup.
  resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;

  server_tokens off;
  access_log /dev/stdout;
  client_max_body_size 50m;

  # Only our own hostnames go upstream as-is; anything else (the twc1.net
  # technical domain, a bare IP) is presented to Vercel as blocks.zone.
  map $host $upstream_host {
    default        blocks.zone;
    blocks.zone    blocks.zone;
    www.blocks.zone www.blocks.zone;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # Pooled TLS connections to Vercel: every request no longer pays a fresh handshake.
  upstream vercel {
    zone vercel 1m;
    server cname.vercel-dns.com:443 resolve;
    keepalive 64;
    keepalive_timeout 300s;
    keepalive_requests 10000;
  }

  server {
    listen 80 default_server;

    location = /__proxy_health {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass https://vercel;
      add_header X-Edge-Vercel-Ttfb $upstream_header_time always;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_ssl_name $upstream_host;
      proxy_set_header Host $upstream_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Assistant replies stream (SSE): pass bytes through as they arrive.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_redirect off;
    }
  }
}
