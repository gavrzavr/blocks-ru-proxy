# Moscow VPS front for blocks.zone (TLS terminates here; Russian visitors only, via Bunny geo-DNS). Russian ISPs reach this box; Vercel is filtered
# even from Moscow datacenters, so we hop through our Amsterdam edge (repo root
# config), which forwards to Vercel with Host: blocks.zone.
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
  resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;

  server_tokens off;
  access_log /var/log/nginx/access.log;
  client_max_body_size 50m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80 default_server;

    location = /__proxy_health { default_type text/plain; return 200 "ok moscow\n"; }
    location = /__test { default_type text/html; add_header Cache-Control no-store; alias /srv/test.html; }
    location = /__big  { default_type text/plain; add_header Cache-Control no-store; alias /srv/big.txt; }
    location / { return 301 https://blocks.zone$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/blocks.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blocks.zone/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    set $edge gavrzavr-blocks-ru-proxy-d73e.twc1.net;

    if ($host = www.blocks.zone) {
      return 308 https://blocks.zone$request_uri;
    }

    location = /__proxy_health {
      default_type text/plain;
      return 200 "ok moscow\n";
    }

    location = /__test {
      default_type text/html;
      add_header Cache-Control no-store;
      alias /srv/test.html;
    }

    location = /__big {
      default_type text/plain;
      add_header Cache-Control no-store;
      alias /srv/big.txt;
    }

    location / {
      proxy_pass https://$edge;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_ssl_name $edge;
      proxy_set_header Host $edge;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_redirect off;
    }
  }
}
