# Moscow VPS front for blocks.zone (TLS terminates here; Russian visitors only, via Bunny geo-DNS).
# Vercel is filtered even from Moscow datacenters, so we hop through our Amsterdam edge (repo root
# config), which forwards to Vercel with Host: blocks.zone. The Moscow->Amsterdam link drops packets,
# so connections are pooled (keepalive) and immutable Next.js assets are cached here.
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
  resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;

  server_tokens off;
  access_log /var/log/nginx/access.log;
  client_max_body_size 50m;

  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=2g inactive=30d use_temp_path=off;

  upstream ams {
    zone ams 1m;
    server gavrzavr-blocks-ru-proxy-d73e.twc1.net:443 resolve;
    keepalive 64;
    keepalive_timeout 300s;
    keepalive_requests 10000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80 default_server;

    location = /__proxy_health { default_type text/plain; return 200 "ok moscow\n"; }
    location = /__test { default_type text/html; add_header Cache-Control no-store; alias /srv/test.html; }
    location = /__big  { default_type text/plain; add_header Cache-Control no-store; alias /srv/big.txt; }
    location / { return 301 https://blocks.zone$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/blocks.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blocks.zone/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    if ($host = www.blocks.zone) {
      return 308 https://blocks.zone$request_uri;
    }

    # Shared upstream settings (inherited by every location below).
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name gavrzavr-blocks-ru-proxy-d73e.twc1.net;
    proxy_ssl_session_reuse on;
    proxy_set_header Host gavrzavr-blocks-ru-proxy-d73e.twc1.net;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_redirect off;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location = /__proxy_health { default_type text/plain; return 200 "ok moscow\n"; }
    location = /__test { default_type text/html; add_header Cache-Control no-store; alias /srv/test.html; }
    location = /__big  { default_type text/plain; add_header Cache-Control no-store; alias /srv/big.txt; }

    # Content-hashed build assets never change: serve them from Moscow.
    location /_next/static/ {
      proxy_pass https://ams;
      proxy_buffering on;
      proxy_cache static;
      proxy_cache_valid 200 30d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating;
      proxy_ignore_headers Set-Cookie Cache-Control Expires;
      add_header X-Proxy-Cache $upstream_cache_status;
    }

    location / {
      proxy_pass https://ams;
      # Assistant replies stream (SSE): pass bytes through as they arrive.
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
